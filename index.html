<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira + Claro · Vendedor</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}header{background:#11185c;color:#fff;padding:22px 18px}h1{font-size:22px;margin:0 0 4px}.sub{opacity:.8;font-size:13px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#fff;position:sticky;top:0;z-index:4;box-shadow:0 2px 8px #0001}nav button{border:0;background:#eef0f7;padding:11px 6px;border-radius:12px;font-weight:700;color:#30384e}nav button.active{background:#11185c;color:#fff}main{padding:14px;max-width:650px;margin:auto}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #17203310}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#667085;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8dce6;border-radius:11px;font-size:16px;background:#fff}textarea{min-height:70px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;font-size:15px}.primary{background:#11185c;color:#fff;width:100%;margin-top:12px}.danger{background:#ffe8e8;color:#b42318}.muted{color:#667085;font-size:13px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kpi{background:#f0f2ff;padding:12px;border-radius:14px}.kpi b{display:block;font-size:18px;margin-top:3px}.item{border-top:1px solid #eee;padding:12px 0}.item:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px}.amount{font-weight:900}.actions{margin-top:8px}.actions button{padding:7px 10px;font-size:12px}.hidden{display:none}.empty{text-align:center;padding:25px;color:#667085}</style></head><body><header><h1>👓 Mira + Claro</h1><div class="sub">Programa móvil para vendedores</div></header><nav><button class="active" data-tab="ventas">💰 Ventas</button><button data-tab="entregas">📦 Entregas</button><button data-tab="gastos">💸 Gastos</button></nav><main><section id="ventas" class="tab"><div class="card"><h2>Registrar venta</h2><div class="grid"><div class="full"><label>Paciente / cliente</label><input id="vcliente" placeholder="Nombre"></div><div><label>Fecha</label><input id="vfecha" type="date"></div><div><label>Tipo de lente</label><input id="vlente" placeholder="Ej. Monofocal"></div><div><label>Total de venta (S/)</label><input id="vtotal" type="number" step="0.01" min="0"></div><div><label>Adelanto (S/)</label><input id="vadelanto" type="number" step="0.01" min="0" value="0"></div><div><label>Saldo restante</label><input id="vsaldo" type="number" step="0.01" readonly></div></div><button class="btn primary" onclick="guardarVenta()">Guardar venta</button></div><div class="card"><h2>Resumen</h2><div class="kpis"><div class="kpi"><span class="muted">Ventas</span><b id="ktotal">S/ 0.00</b></div><div class="kpi"><span class="muted">Adelantos</span><b id="kadel">S/ 0.00</b></div><div class="kpi"><span class="muted">Saldos</span><b id="ksaldo">S/ 0.00</b></div></div></div><div class="card"><h2>Ventas registradas</h2><div id="listaVentas"></div></div></section><section id="entregas" class="tab hidden"><div class="card"><h2>Registrar entrega</h2><div class="grid"><div class="full"><label>Cliente</label><input id="ecliente" placeholder="Nombre"></div><div><label>Fecha</label><input id="efecha" type="date"></div><div><label>Producto / lente</label><input id="eproducto" placeholder="Ej. Lentes completos"></div><div><label>Monto cobrado (S/)</label><input id="emonto" type="number" step="0.01" min="0"></div><div><label>Medio de pago</label><select id="epago"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Tarjeta</option></select></div><div><label>Estado</label><select id="eestado"><option>Entregado</option><option>Pendiente</option></select></div></div><button class="btn primary" onclick="guardarEntrega()">Guardar entrega</button></div><div class="card"><h2>Entregas</h2><div id="listaEntregas"></div></div></section><section id="gastos" class="tab hidden"><div class="card"><h2>Registrar gasto</h2><div class="grid"><div><label>Fecha</label><input id="gfecha" type="date"></div><div><label>Monto (S/)</label><input id="gmonto" type="number" step="0.01" min="0"></div><div class="full"><label>Concepto</label><input id="gconcepto" placeholder="Ej. movilidad"></div><div><label>Medio de pago</label><select id="gpago"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Tarjeta</option></select></div><div class="full"><label>Observaciones</label><textarea id="gobs" placeholder="Opcional"></textarea></div></div><button class="btn primary" onclick="guardarGasto()">Guardar gasto</button></div><div class="card"><h2>Gastos registrados</h2><div id="listaGastos"></div></div><div class="card"><button class="btn" onclick="exportar()">⬇️ Exportar respaldo</button> <button class="btn" onclick="document.getElementById('importFile').click()">⬆️ Importar respaldo</button><input id="importFile" type="file" accept=".json" hidden onchange="importar(event)"></div></section></main><script>const key='miraClaroVendedorV1';let db=JSON.parse(localStorage.getItem(key)||'{"ventas":[],"entregas":[],"gastos":[]}');const hoy=()=>new Date().toISOString().slice(0,10);['vfecha','efecha','gfecha'].forEach(id=>document.getElementById(id).value=hoy());const money=n=>'S/ '+Number(n||0).toFixed(2);function save(){localStorage.setItem(key,JSON.stringify(db));render()}function calc(){let t=+vtotal.value||0,a=+vadelanto.value||0;vsaldo.value=Math.max(0,t-a).toFixed(2)}vtotal.oninput=calc;vadelanto.oninput=calc;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')});function guardarVenta(){let t=+vtotal.value||0,a=+vadelanto.value||0;if(!vcliente.value||t<=0)return alert('Completa cliente y total de venta.');if(a>t)return alert('El adelanto no puede superar el total.');db.ventas.unshift({id:Date.now(),cliente:vcliente.value,fecha:vfecha.value,lente:vlente.value,total:t,adelanto:a,saldo:t-a});['vcliente','vlente','vtotal','vadelanto','vsaldo'].forEach(id=>document.getElementById(id).value='');vadelanto.value=0;save()}function guardarEntrega(){let m=+emonto.value||0;if(!ecliente.value)return alert('Completa el cliente.');db.entregas.unshift({id:Date.now(),cliente:ecliente.value,fecha:efecha.value,producto:eproducto.value,monto:m,pago:epago.value,estado:eestado.value});['ecliente','eproducto','emonto'].forEach(id=>document.getElementById(id).value='');save()}function guardarGasto(){let m=+gmonto.value||0;if(!gconcepto.value||m<=0)return alert('Completa concepto y monto.');db.gastos.unshift({id:Date.now(),fecha:gfecha.value,monto:m,concepto:gconcepto.value,pago:gpago.value,obs:gobs.value});['gmonto','gconcepto','gobs'].forEach(id=>document.getElementById(id).value='');save()}function del(type,id){if(confirm('¿Eliminar este registro?')){db[type]=db[type].filter(x=>x.id!==id);save()}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){listaVentas.innerHTML=db.ventas.length?db.ventas.map(x=>`<div class="item"><div class="row"><b>${esc(x.cliente)}</b><span class="amount">${money(x.total)}</span></div><div class="muted">${x.fecha} · ${esc(x.lente||'Sin especificar')} · Adelanto ${money(x.adelanto)} · Saldo ${money(x.saldo)}</div><div class="actions"><button class="btn danger" onclick="del('ventas',${x.id})">Eliminar</button></div></div>`).join(''):'<div class="empty">Aún no hay ventas.</div>';listaEntregas.innerHTML=db.entregas.length?db.entregas.map(x=>`<div class="item"><div class="row"><b>${esc(x.cliente)}</b><span class="amount">${money(x.monto)}</span></div><div class="muted">${x.fecha} · ${esc(x.producto||'')} · ${esc(x.pago)} · ${esc(x.estado)}</div><div class="actions"><button class="btn danger" onclick="del('entregas',${x.id})">Eliminar</button></div></div>`).join(''):'<div class="empty">Aún no hay entregas.</div>';listaGastos.innerHTML=db.gastos.length?db.gastos.map(x=>`<div class="item"><div class="row"><b>${esc(x.concepto)}</b><span class="amount">-${money(x.monto)}</span></div><div class="muted">${x.fecha} · ${esc(x.pago)} · ${esc(x.obs||'')}</div><div class="actions"><button class="btn danger" onclick="del('gastos',${x.id})">Eliminar</button></div></div>`).join(''):'<div class="empty">Aún no hay gastos.</div>';ktotal.textContent=money(db.ventas.reduce((s,x)=>s+x.total,0));kadel.textContent=money(db.ventas.reduce((s,x)=>s+x.adelanto,0));ksaldo.textContent=money(db.ventas.reduce((s,x)=>s+x.saldo,0))}function exportar(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mira-claro-respaldo.json';a.click()}function importar(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.ventas&&x.entregas&&x.gastos){db=x;save();alert('Respaldo importado.')}else throw 0}catch(_){alert('Archivo no válido.')}};r.readAsText(f)}render();</script></body></html>
